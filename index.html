<!DOCTYPE html>
<html lang="ko">

<title>해외사업본부 DASHBOARD</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Malgun Gothic',sans-serif;background:#0f1117;color:#e0e0e0;}
.dash{background:#0f1117;color:#e0e0e0;min-height:100vh;display:flex;flex-direction:column;}
.topbar{background:#161a24;border-bottom:1px solid #2a2e3a;padding:10px 20px;display:flex;align-items:center;justify-content:space-between;}
.logo{font-size:13px;font-weight:600;color:#7c8cf8;letter-spacing:1px;}
.badge{background:#2a2e3a;color:#9aa0b0;font-size:11px;padding:3px 8px;border-radius:4px;}
.topbar-right{display:flex;align-items:center;gap:10px;}
.date-txt{font-size:12px;color:#6b7280;}
.btn{font-size:12px;font-weight:500;padding:7px 14px;border-radius:6px;border:none;cursor:pointer;}
.btn-add{background:#5b6ef5;color:#fff;}
.btn-edit{background:#2a2e3a;color:#c0c4d0;}
.btn-edit.active{background:#5b6ef5;color:#fff;}
.main{display:flex;flex:1;}
.sidebar{width:160px;background:#161a24;border-right:1px solid #2a2e3a;padding:16px 0;flex-shrink:0;}
.sidebar-section{font-size:10px;color:#4b5060;padding:6px 16px 4px;letter-spacing:.5px;}
.sidebar-item{padding:7px 16px;font-size:12px;color:#9aa0b0;cursor:pointer;}
.member-item{padding:6px 12px;display:flex;align-items:center;gap:8px;cursor:pointer;}
.avatar{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0;}
.member-info{flex:1;min-width:0;}
.member-name{font-size:12px;color:#d0d4e0;}
.member-role{font-size:10px;color:#6b7280;}
.member-count{font-size:11px;color:#6b7280;}
.content{flex:1;padding:20px;overflow-y:auto;}
.stat-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:24px;}
.stat-card{background:#161a24;border:1px solid #2a2e3a;border-radius:8px;padding:14px 16px;cursor:pointer;transition:border-color .15s;}
.stat-card:hover{border-color:#5b6ef5;}
.stat-card.active{border-color:#5b6ef5;background:#1a1f33;}
.stat-label{font-size:11px;color:#6b7280;margin-bottom:6px;}
.stat-num{font-size:24px;font-weight:600;}
.stat-sub{font-size:10px;color:#6b7280;margin-top:2px;}
.section-title{font-size:13px;font-weight:500;color:#c0c4d0;margin-bottom:12px;}
.team-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px;margin-bottom:24px;}
.team-card{background:#161a24;border:1px solid #2a2e3a;border-radius:8px;padding:12px;text-align:center;position:relative;cursor:pointer;transition:border-color .15s;}
.team-card:hover{border-color:#5b6ef5;}
.team-card.active{border-color:#5b6ef5;background:#1a1f33;}
.team-avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;margin:0 auto 6px;}
.team-name{font-size:12px;color:#c0c4d0;margin-bottom:2px;}
.team-role{font-size:10px;color:#6b7280;margin-bottom:6px;}
.team-count{font-size:18px;font-weight:600;}
.progress{height:3px;background:#2a2e3a;border-radius:2px;margin-top:6px;}
.progress-bar{height:100%;border-radius:2px;}
.edit-icon{position:absolute;top:6px;right:6px;font-size:11px;color:#4b5060;cursor:pointer;display:none;}
.edit-mode .team-card:hover .edit-icon{display:block;}
.task-table{width:100%;border-collapse:collapse;}
.task-table th{font-size:11px;color:#9aa0b0;text-align:left;padding:6px 10px;border-bottom:1px solid #2a2e3a;font-weight:400;}
.task-table td{padding:10px 10px;border-bottom:1px solid #1e2235;font-size:12px;vertical-align:middle;color:#e0e0e0;}
.cat-badge{font-size:10px;padding:3px 8px;border-radius:4px;font-weight:500;}
.chip{font-size:10px;padding:2px 7px;border-radius:10px;font-weight:500;}
.priority-badge{font-size:10px;padding:2px 7px;border-radius:4px;font-weight:500;}
.p-high{background:#3a1a1a;color:#e57373;}
.p-mid{background:#2a2a1a;color:#fbbf24;}
.date-overdue{color:#e57373;font-size:11px;}
.date-ok{color:#9aa0b0;font-size:11px;}
.status-select{background:#1e2235;border:1px solid #2a2e3a;color:#9aa0b0;font-size:11px;padding:3px 6px;border-radius:4px;}
.status-done{background:#1a2e1e;border-color:#2d4a2d;color:#4ade80;}
.search-bar{background:#161a24;border:1px solid #2a2e3a;border-radius:6px;padding:8px 12px;display:flex;align-items:center;gap:8px;margin-bottom:12px;}
.search-bar input{background:none;border:none;outline:none;font-size:12px;color:#e0e0e0;flex:1;}
.search-bar input::placeholder{color:#4b5060;}
.filter-bar{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
.filter-tag{font-size:11px;padding:3px 10px;border-radius:12px;background:#1e2235;border:1px solid #3a3e4a;color:#9aa0b0;}
.filter-tag.active{background:#1e2a4a;border-color:#5b6ef5;color:#7c8cf8;}
.filter-clear{font-size:11px;color:#e57373;cursor:pointer;padding:3px 8px;border-radius:12px;border:1px solid #3a1a1a;background:none;}
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;z-index:1000;}
.modal{background:#1e2235;border:1px solid #3a3e4a;border-radius:12px;padding:24px;width:440px;max-height:90vh;overflow-y:auto;}
.modal-title{font-size:15px;font-weight:500;color:#e0e0e0;margin-bottom:18px;}
.form-group{margin-bottom:14px;}
.form-label{font-size:11px;color:#6b7280;margin-bottom:5px;display:block;}
.form-input{width:100%;background:#161a24;border:1px solid #2a2e3a;border-radius:6px;padding:8px 10px;font-size:12px;color:#d0d4e0;outline:none;}
.form-input:focus{border-color:#5b6ef5;}
.form-select{width:100%;background:#161a24;border:1px solid #2a2e3a;border-radius:6px;padding:8px 10px;font-size:12px;color:#d0d4e0;outline:none;}
.modal-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;}
.btn-cancel{background:#2a2e3a;color:#9aa0b0;padding:8px 16px;border-radius:6px;border:none;cursor:pointer;font-size:12px;}
.btn-save{background:#5b6ef5;color:#fff;padding:8px 16px;border-radius:6px;border:none;cursor:pointer;font-size:12px;}
.btn-danger{background:#3a1a1a;color:#e57373;padding:8px 16px;border-radius:6px;border:none;cursor:pointer;font-size:12px;}
.assignee-select{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;}
.assignee-toggle{font-size:11px;padding:3px 9px;border-radius:10px;cursor:pointer;border:1px solid #2a2e3a;background:#161a24;color:#9aa0b0;}
.assignee-toggle.selected{border-color:#5b6ef5;background:#1e2040;color:#7c8cf8;}
.color-options{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;}
.color-opt{width:22px;height:22px;border-radius:50%;cursor:pointer;border:2px solid transparent;}
.color-opt.selected{border-color:#fff;}
.cat-list{display:flex;flex-direction:column;gap:8px;}
.cat-row{display:flex;align-items:center;gap:8px;}
.cat-color-dot{width:14px;height:14px;border-radius:50%;flex-shrink:0;}
.cat-row input{flex:1;background:#161a24;border:1px solid #2a2e3a;border-radius:6px;padding:6px 8px;font-size:12px;color:#d0d4e0;outline:none;}
.cat-del-btn{background:none;border:none;color:#e57373;cursor:pointer;font-size:13px;padding:2px 4px;}
.cat-add-btn{background:#1e2235;border:1px dashed #3a3e4a;color:#6b7280;font-size:11px;padding:6px 12px;border-radius:6px;cursor:pointer;margin-top:4px;}
.cat-settings-btn{font-size:11px;color:#6b7280;background:#1e2235;border:1px solid #2a2e3a;padding:4px 10px;border-radius:5px;cursor:pointer;margin-left:8px;}
.btn-add-task{background:#1e2235;border:1px dashed #3a3e4a;color:#6b7280;font-size:12px;padding:8px 16px;border-radius:6px;cursor:pointer;width:100%;text-align:left;margin-top:8px;}
.empty-msg{text-align:center;color:#4b5060;font-size:13px;padding:32px 0;}
.loading{text-align:center;color:#6b7280;font-size:13px;padding:32px 0;}
.sync-indicator{font-size:10px;color:#3ecf8e;margin-left:8px;}

</head>
<body>

<div class="dash" id="app">
  <div class="topbar">
    <div style="display:flex;align-items:center;gap:12px;">
      <span class="logo">해외사업본부 // DASHBOARD</span>
      <span class="badge">EPC PROJECT · REV.1</span>
      <span class="sync-indicator" id="sync-indicator">● 연결중...</span>
    </div>
    <div class="topbar-right">
      <span class="date-txt" id="today-date"></span>
      <button class="btn btn-edit" id="edit-toggle-btn" onclick="toggleEditMode()">✏️ 편집 모드</button>
      <button class="btn btn-add" onclick="openAddTask()">+ 업무 추가</button>
    </div>
  </div>
  <div class="main">
    <div class="sidebar">
      <div class="sidebar-section">필터</div>
      <div class="sidebar-item" onclick="clearAllFilters()" style="color:#7c8cf8;">● 전체 업무</div>
      <div class="sidebar-section" style="margin-top:12px;">팀원</div>

      <div class="sidebar-section" style="margin-top:12px;">카테고리</div>
      <div id="sidebar-cats"></div>
    </div>
    <div class="content" id="main-content">
      <div class="stat-grid" id="stat-grid"></div>
      <div class="section-title">팀별 업무 현황</div>
      <div class="team-grid" id="team-grid"></div>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
        <div style="display:flex;align-items:center;">
          <div class="section-title" style="margin-bottom:0;">전체 업무 목록</div>
          <button class="cat-settings-btn" id="cat-settings-btn" style="display:none;" onclick="openCatSettings()">⚙ 카테고리 관리</button>
        </div>
        <div style="font-size:12px;color:#6b7280;" id="task-count-label"></div>
      </div>
      <div class="filter-bar" id="filter-bar" style="display:none;">
        <span style="font-size:11px;color:#6b7280;">필터:</span>
        <span id="active-filter-tags"></span>
        <span class="filter-clear" onclick="clearAllFilters()">✕ 전체 보기</span>
      </div>
      <div class="search-bar">
        <span style="font-size:12px;color:#4b5060;">⌕</span>
        <input type="text" placeholder="업무명, 담당자, 협력사 검색..." oninput="applyFilters()">
      </div>
      <table class="task-table">
        <thead><tr><th>카테고리</th><th>업무별</th><th>담당자</th><th>우선순위</th><th>기한</th><th>상태</th><th></th></tr></thead>
        <tbody id="task-body"><tr><td colspan="7"><div class="loading">⏳ 데이터 불러오는 중...</div></td></tr></tbody>
      </table>
      <button class="btn-add-task" id="add-task-row-btn" style="display:none;" onclick="openAddTask()">+ 업무 추가</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal" style="display:none;">
  <div class="modal" id="modal-content"></div>
</div>

  {cat:"발주처",name:"사업수행 계획서 작성",sub:"",assignees:["주민","김진","강승","이상","이인"],priority:"높음",date:"2026-04-15",status:"대기"},
  {cat:"발주처",name:"발주처 기성 신청 - Permit Design 제출",sub:"",assignees:["주민"],priority:"높음",date:"2026-04-03",status:"대기"},

];

// ============================================================
// 앱 상태
// ============================================================
let members=[];
let categories=[];
let tasks=[];
let editMode=false;
let filterStatus=null;
let filterMember=null;
let searchQuery="";

const today=new Date();
document.getElementById("today-date").textContent=`${today.getFullYear()}년 ${today.getMonth()+1}월 ${today.getDate()}일`;

// ============================================================
// Firebase 초기화 및 실시간 동기화
// ============================================================
async function initFirebase(){
  // 첫 실행 시 기본 데이터 업로드
  const settingsDoc = await db.collection("settings").doc("config").get();
  if(!settingsDoc.exists){
    await db.collection("settings").doc("config").set({
      members: DEFAULT_MEMBERS,
      categories: DEFAULT_CATEGORIES,
      initialized: true
    });
    for(const task of DEFAULT_TASKS){
      await db.collection("tasks").add(task);
    }
  }

  // 실시간 설정 동기화
  db.collection("settings").doc("config").onSnapshot(doc=>{
    if(doc.exists){
      const data=doc.data();
      members=data.members||DEFAULT_MEMBERS;
      categories=data.categories||DEFAULT_CATEGORIES;
      document.getElementById("sync-indicator").textContent="● 실시간 연결됨";
      document.getElementById("sync-indicator").style.color="#3ecf8e";
      renderAll();
    }
  });

  // 실시간 업무 동기화
  db.collection("tasks").onSnapshot(snapshot=>{
    tasks=snapshot.docs.map(doc=>({firestoreId:doc.id,...doc.data()}));
    applyFilters();
  });
}

// ============================================================
// 데이터 저장 함수들
// ============================================================
async function saveSettings(){
  await db.collection("settings").doc("config").update({members,categories});
}

async function addTask(data){
  await db.collection("tasks").add(data);
}

async function updateTask(firestoreId,data){
  await db.collection("tasks").doc(firestoreId).update(data);
}

async function removeTask(firestoreId){
  await db.collection("tasks").doc(firestoreId).delete();
}

// ============================================================
// 렌더링
// ============================================================
function getCat(id){return categories.find(c=>c.id===id)||{label:id,color:"#9aa0b0",bg:"#2a2e3a"};}
function getMember(id){return members.find(m=>m.id===id)||{color:"#9aa0b0",bg:"#2a2e3a"};}

function toggleEditMode(){
  editMode=!editMode;
  document.getElementById("edit-toggle-btn").textContent=editMode?"✅ 편집 완료":"✏️ 편집 모드";
  document.getElementById("edit-toggle-btn").className=editMode?"btn btn-edit active":"btn btn-edit";
  document.getElementById("main-content").className=editMode?"content edit-mode":"content";
  document.getElementById("add-task-row-btn").style.display=editMode?"block":"none";
  document.getElementById("cat-settings-btn").style.display=editMode?"inline-block":"none";
  renderAll();
}

function getMemberCount(memberId){
  return tasks.filter(t=>t.assignees&&t.assignees.includes(memberId)&&t.status!=="완료").length;
}

function renderAll(){renderStats();renderSidebar();renderTeam();applyFilters();}

function renderStats(){
  const now=new Date();now.setHours(0,0,0,0);
  const STAT_FILTERS=["all","진행중","완료","긴급","기한초과"];
  const counts=[
    tasks.length,
    tasks.filter(t=>t.status==="진행중").length,
    tasks.filter(t=>t.status==="완료").length,
    tasks.filter(t=>t.priority==="높음"&&t.status!=="완료").length,
    tasks.filter(t=>{const d=new Date(t.date);d.setHours(0,0,0,0);return d<now&&t.status!=="완료";}).length,
  ];
  const labels=["전체 업무","진행중","완료","긴급","기한 초과"];
  const subs=["개 업무","개 업무","개 업무","높음 우선순위","개 업무"];
  const colors=["#7c8cf8","#7c8cf8","#3ecf8e","#e57373","#f97316"];
  document.getElementById("stat-grid").innerHTML=counts.map((n,i)=>`
    <div class="stat-card ${filterStatus===STAT_FILTERS[i]||(i===0&&!filterStatus&&!filterMember)?"active":""}" onclick="setStatFilter('${STAT_FILTERS[i]}')">
      <div class="stat-label">${labels[i]}</div>
      <div class="stat-num" style="color:${colors[i]};">${n}</div>
      <div class="stat-sub">${subs[i]}</div>
    </div>`).join("");
}

function renderSidebar(){
  document.getElementById("member-list").innerHTML=members.map(m=>`
    <div class="member-item" onclick="setMemberFilter('${m.id}')">
      <div class="avatar" style="background:${m.bg};color:${m.color};">${m.id}</div>
      <div class="member-info"><div class="member-name">${m.name}</div><div class="member-role">${m.role}</div></div>
      <div class="member-count">${getMemberCount(m.id)}</div>
    </div>`).join("");
  document.getElementById("sidebar-cats").innerHTML=categories.map(c=>`
    <div class="sidebar-item" style="display:flex;align-items:center;gap:6px;">
      <span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:${c.color};"></span>${c.label}
    </div>`).join("");
}

function renderTeam(){
  const counts=members.map(m=>getMemberCount(m.id));
  const max=Math.max(...counts,1);
  const grid=document.getElementById("team-grid");
  grid.innerHTML=members.map((m,i)=>`
    <div class="team-card ${filterMember===m.id?"active":""}" onclick="${editMode?`openEditMember(${i})`:`setMemberFilter('${m.id}')`}">
      <span class="edit-icon">✏️</span>
      <div class="team-avatar" style="background:${m.bg};color:${m.color};">${m.id}</div>
      <div class="team-name">${m.name}</div>
      <div class="team-role">${m.role}</div>
      <div class="team-count" style="color:${m.color};">${counts[i]}</div>
      <div class="progress"><div class="progress-bar" style="width:${counts[i]===0?2:Math.round(counts[i]/max*100)}%;background:${counts[i]===0?"#e57373":m.color};"></div></div>
    </div>`).join("");
  if(editMode){
    const a=document.createElement("div");
    a.className="team-card";
    a.style.cssText="border:1px dashed #3a3e4a;cursor:pointer;display:flex;align-items:center;justify-content:center;min-height:100px;color:#6b7280;font-size:12px;";
    a.textContent="+ 팀원 추가";
    a.onclick=openAddMember;
    grid.appendChild(a);
  }
}

function setStatFilter(val){
  filterStatus=(val==="all"||filterStatus===val)?null:val;
  filterMember=null;
  renderAll();
}

function setMemberFilter(id){
  filterMember=(filterMember===id)?null:id;
  filterStatus=null;
  renderAll();
}

function clearAllFilters(){
  filterStatus=null;filterMember=null;
  const inp=document.querySelector(".search-bar input");
  if(inp)inp.value="";
  searchQuery="";
  renderAll();
}

function applyFilters(){
  const inp=document.querySelector(".search-bar input");
  searchQuery=inp?inp.value.toLowerCase():"";
  const now=new Date();now.setHours(0,0,0,0);
  let list=tasks.filter(t=>{
    if(filterStatus==="진행중"&&t.status!=="진행중")return false;
    if(filterStatus==="완료"&&t.status!=="완료")return false;
    if(filterStatus==="긴급"&&!(t.priority==="높음"&&t.status!=="완료"))return false;
    if(filterStatus==="기한초과"){const d=new Date(t.date);d.setHours(0,0,0,0);if(!(d<now&&t.status!=="완료"))return false;}
    if(filterMember&&!(t.assignees&&t.assignees.includes(filterMember)))return false;
    if(searchQuery&&!(t.name.toLowerCase().includes(searchQuery)||(t.sub||"").toLowerCase().includes(searchQuery)||(t.assignees||[]).some(a=>a.includes(searchQuery))))return false;
    return true;
  });
  renderTasks(list);
  renderFilterBar();
  renderStats();
  renderTeam();
}

function renderFilterBar(){
  const hasFilter=filterStatus||filterMember||searchQuery;
  document.getElementById("filter-bar").style.display=hasFilter?"flex":"none";
  if(!hasFilter)return;
  let tags=[];
  if(filterStatus)tags.push(`<span class="filter-tag active">${filterStatus==="기한초과"?"기한 초과":filterStatus}</span>`);
  if(filterMember){const m=getMember(filterMember);tags.push(`<span class="filter-tag active" style="border-color:${m.color};color:${m.color};">👤 ${members.find(mb=>mb.id===filterMember)?.name||filterMember}</span>`);}
  if(searchQuery)tags.push(`<span class="filter-tag active">"${searchQuery}"</span>`);
  document.getElementById("active-filter-tags").innerHTML=tags.join("");
}

function renderTasks(list){
  document.getElementById("task-count-label").textContent=`${list.length}개`;
  const now=new Date();now.setHours(0,0,0,0);
  if(list.length===0){
    document.getElementById("task-body").innerHTML=`<tr><td colspan="7"><div class="empty-msg">조건에 맞는 업무가 없습니다</div></td></tr>`;
    return;
  }
  document.getElementById("task-body").innerHTML=list.map(t=>{
    const cat=getCat(t.cat);
    const d=new Date(t.date);d.setHours(0,0,0,0);
    const overdue=d<now&&t.status!=="완료";
    const chips=(t.assignees||[]).map(a=>{const m=getMember(a);return`<span class="chip" style="background:${m.bg};color:${m.color};">● ${a}</span>`;}).join(" ");
    return`<tr>
      <td><span class="cat-badge" style="background:${cat.bg};color:${cat.color};">${cat.label}</span></td>
      <td><div style="color:#e0e0e0;font-size:12px;font-weight:500;">${t.name}</div>${t.sub?`<div style="font-size:10px;color:#9aa0b0;margin-top:2px;">${t.sub}</div>`:""}</td>
      <td><div style="display:flex;gap:4px;flex-wrap:wrap;">${chips}</div></td>
      <td><span class="priority-badge ${t.priority==="높음"?"p-high":"p-mid"}">${t.priority}</span></td>
      <td><span class="${overdue?"date-overdue":"date-ok"}">${t.date}</span></td>
      <td><select class="status-select ${t.status==="완료"?"status-done":""}" onchange="changeStatus('${t.firestoreId}',this.value)">
        <option ${t.status==="완료"?"selected":""}>완료</option>
        <option ${t.status==="진행중"?"selected":""}>진행중</option>
        <option ${t.status==="대기"?"selected":""}>대기</option>
      </select></td>
      <td style="white-space:nowrap;">${editMode?`<button style="background:none;border:none;color:#7c8cf8;cursor:pointer;font-size:11px;padding:2px 4px;" onclick="openEditTask('${t.firestoreId}')">✏️</button><button style="background:none;border:none;color:#e57373;cursor:pointer;font-size:11px;padding:2px 4px;" onclick="deleteTask('${t.firestoreId}')">🗑</button>`:""}</td>
    </tr>`;
  }).join("");
}

function changeStatus(firestoreId,val){
  updateTask(firestoreId,{status:val});
}

function deleteTask(firestoreId){
  if(confirm("이 업무를 삭제할까요?")){removeTask(firestoreId);}
}

function closeModal(){document.getElementById("modal").style.display="none";}

// ── 카테고리 관리 ──
function openCatSettings(){renderCatModal();document.getElementById("modal").style.display="flex";}
function renderCatModal(){
  document.getElementById("modal-content").innerHTML=`
    <div class="modal-title">카테고리 관리</div>
    <div class="cat-list">
      ${categories.map((c,i)=>`
        <div class="cat-row">
          <div class="cat-color-dot" style="background:${c.color};"></div>
          <input value="${c.label}" onchange="updateCatLabel(${i},this.value)">
          <div style="display:flex;gap:4px;">${CAT_PRESETS.map((p,pi)=>`<div style="width:14px;height:14px;border-radius:50%;background:${p.c};cursor:pointer;border:2px solid ${c.color===p.c?'#fff':'transparent'};" onclick="updateCatColor(${i},${pi})"></div>`).join("")}</div>
          <button class="cat-del-btn" onclick="deleteCat(${i})">✕</button>
        </div>`).join("")}
    </div>
    <button class="cat-add-btn" onclick="addCat()">+ 카테고리 추가</button>
    <div class="modal-btns"><button class="btn-cancel" onclick="closeModal()">닫기</button></div>`;
}
function updateCatLabel(i,val){categories[i].label=val;saveSettings();renderCatModal();}
function updateCatColor(ci,pi){categories[ci].color=CAT_PRESETS[pi].c;categories[ci].bg=CAT_PRESETS[pi].bg;saveSettings();renderCatModal();}
function addCat(){
  const p=CAT_PRESETS[categories.length%CAT_PRESETS.length];
  categories.push({id:"cat"+Date.now(),label:"새 카테고리",color:p.c,bg:p.bg});
  saveSettings();renderCatModal();
}
function deleteCat(i){
  if(categories.length<=1){alert("카테고리는 최소 1개 이상 필요합니다.");return;}
  if(confirm(`'${categories[i].label}' 카테고리를 삭제할까요?`)){
    categories.splice(i,1);
    saveSettings();renderCatModal();renderAll();
  }
}

// ── 팀원 ──
function openEditMember(idx){
  const m=members[idx];
  let sci=MEMBER_COLORS.findIndex(c=>c.c===m.color);if(sci<0)sci=0;
  document.getElementById("modal-content").innerHTML=`
    <div class="modal-title">팀원 편집</div>
    <div class="form-group"><label class="form-label">아이디 (2글자)</label><input class="form-input" id="m-id" maxlength="2" value="${m.id}"></div>
    <div class="form-group"><label class="form-label">이름</label><input class="form-input" id="m-name" value="${m.name}"></div>
    <div class="form-group"><label class="form-label">역할/소속</label><input class="form-input" id="m-role" value="${m.role}"></div>
    <div class="form-group"><label class="form-label">색상</label><div class="color-options">${MEMBER_COLORS.map((c,i)=>`<div class="color-opt ${i===sci?"selected":""}" style="background:${c.c};" onclick="selectMColor(${i},this)"></div>`).join("")}</div></div>
    <div class="modal-btns">
      <button class="btn-danger" onclick="deleteMember(${idx})">삭제</button>
      <button class="btn-cancel" onclick="closeModal()">취소</button>
      <button class="btn-save" onclick="saveMember(${idx})">저장</button>
    </div>`;
  document.getElementById("modal").style.display="flex";
}
function openAddMember(){
  document.getElementById("modal-content").innerHTML=`
    <div class="modal-title">팀원 추가</div>
    <div class="form-group"><label class="form-label">아이디 (2글자)</label><input class="form-input" id="m-id" maxlength="2" placeholder="예: 홍길"></div>
    <div class="form-group"><label class="form-label">이름</label><input class="form-input" id="m-name" placeholder="예: 홍길동"></div>
    <div class="form-group"><label class="form-label">역할/소속</label><input class="form-input" id="m-role" placeholder="예: 구매"></div>
    <div class="form-group"><label class="form-label">색상</label><div class="color-options">${MEMBER_COLORS.map((c,i)=>`<div class="color-opt ${i===0?"selected":""}" style="background:${c.c};" onclick="selectMColor(${i},this)"></div>`).join("")}</div></div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal()">취소</button>
      <button class="btn-save" onclick="saveMember(-1)">추가</button>
    </div>`;
  document.getElementById("modal").style.display="flex";
}
function selectMColor(i,el){document.querySelectorAll(".color-opt").forEach(e=>e.classList.remove("selected"));el.classList.add("selected");}
function getSelMCI(){return[...document.querySelectorAll(".color-opt")].findIndex(e=>e.classList.contains("selected"));}
function saveMember(idx){
  const id=document.getElementById("m-id").value.trim();
  const name=document.getElementById("m-name").value.trim();
  const role=document.getElementById("m-role").value.trim();
  if(!id||!name)return alert("아이디와 이름을 입력해주세요.");
  const ci=getSelMCI();const col=MEMBER_COLORS[ci<0?0:ci];
  if(idx>=0){members[idx]={...members[idx],id,name,role,color:col.c,bg:col.bg};}
  else{members.push({id,name,role,color:col.c,bg:col.bg});}
  saveSettings();closeModal();
}
function deleteMember(idx){
  if(confirm("팀원을 삭제할까요?")){
    members.splice(idx,1);
    saveSettings();closeModal();
  }
}

// ── 업무 ──
function buildAssigneeSelect(sel=[]){
  return`<div class="assignee-select">${members.map(m=>`<span class="assignee-toggle ${sel.includes(m.id)?"selected":""}" onclick="this.classList.toggle('selected')">${m.name}</span>`).join("")}</div>`;
}
function getSelAssignees(){
  return[...document.querySelectorAll(".assignee-toggle.selected")].map(e=>{const m=members.find(mb=>mb.name===e.textContent);return m?m.id:e.textContent;});
}
function buildCatOptions(sel){return categories.map(c=>`<option value="${c.id}" ${c.id===sel?"selected":""}>${c.label}</option>`).join("");}

function openAddTask(){
  document.getElementById("modal-content").innerHTML=`
    <div class="modal-title">업무 추가</div>
    <div class="form-group"><label class="form-label">카테고리</label><select class="form-select" id="t-cat">${buildCatOptions(categories[0]?.id)}</select></div>
    <div class="form-group"><label class="form-label">업무명</label><input class="form-input" id="t-name" placeholder="업무 이름"></div>
    <div class="form-group"><label class="form-label">설명 (선택)</label><input class="form-input" id="t-sub" placeholder="세부 내용"></div>
    <div class="form-group"><label class="form-label">담당자</label>${buildAssigneeSelect()}</div>
    <div class="form-group"><label class="form-label">우선순위</label><select class="form-select" id="t-priority"><option>높음</option><option>보통</option></select></div>
    <div class="form-group"><label class="form-label">기한</label><input class="form-input" type="date" id="t-date" value="${new Date().toISOString().split('T')[0]}"></div>
    <div class="form-group"><label class="form-label">상태</label><select class="form-select" id="t-status"><option>대기</option><option>진행중</option><option>완료</option></select></div>
    <div class="modal-btns"><button class="btn-cancel" onclick="closeModal()">취소</button><button class="btn-save" onclick="saveTask(null)">추가</button></div>`;
  document.getElementById("modal").style.display="flex";
}

function openEditTask(firestoreId){
  const t=tasks.find(t=>t.firestoreId===firestoreId);if(!t)return;
  document.getElementById("modal-content").innerHTML=`
    <div class="modal-title">업무 편집</div>
    <div class="form-group"><label class="form-label">카테고리</label><select class="form-select" id="t-cat">${buildCatOptions(t.cat)}</select></div>
    <div class="form-group"><label class="form-label">업무명</label><input class="form-input" id="t-name" value="${t.name}"></div>
    <div class="form-group"><label class="form-label">설명 (선택)</label><input class="form-input" id="t-sub" value="${t.sub||""}"></div>
    <div class="form-group"><label class="form-label">담당자</label>${buildAssigneeSelect(t.assignees||[])}</div>
    <div class="form-group"><label class="form-label">우선순위</label><select class="form-select" id="t-priority"><option ${t.priority==="높음"?"selected":""}>높음</option><option ${t.priority==="보통"?"selected":""}>보통</option></select></div>
    <div class="form-group"><label class="form-label">기한</label><input class="form-input" type="date" id="t-date" value="${t.date}"></div>
    <div class="form-group"><label class="form-label">상태</label><select class="form-select" id="t-status"><option ${t.status==="대기"?"selected":""}>대기</option><option ${t.status==="진행중"?"selected":""}>진행중</option><option ${t.status==="완료"?"selected":""}>완료</option></select></div>
    <div class="modal-btns">
      <button class="btn-danger" onclick="deleteTask('${firestoreId}');closeModal();">삭제</button>
      <button class="btn-cancel" onclick="closeModal()">취소</button>
      <button class="btn-save" onclick="saveTask('${firestoreId}')">저장</button>
    </div>`;
  document.getElementById("modal").style.display="flex";
}

function saveTask(firestoreId){
  const name=document.getElementById("t-name").value.trim();
  if(!name)return alert("업무명을 입력해주세요.");
  const data={
    cat:document.getElementById("t-cat").value,
    name,
    sub:document.getElementById("t-sub").value.trim(),
    assignees:getSelAssignees(),
    priority:document.getElementById("t-priority").value,
    date:document.getElementById("t-date").value,
    status:document.getElementById("t-status").value
  };
  if(!firestoreId){addTask(data);}
  else{updateTask(firestoreId,data);}
  closeModal();
}

document.getElementById("modal").addEventListener("click",function(e){if(e.target===this)closeModal();});

// 시작!
initFirebase();
</script>
</body>
</html>
